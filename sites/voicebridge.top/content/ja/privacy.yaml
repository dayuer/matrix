# 英語版（content/en/privacy.yaml）からの翻訳。中国語版が正本。日付は三言語とも同一にすること。
# UI 名称は App の日本語ローカライズ（Localizable.xcstrings の ja）に合わせている。
blocks:
  - type: custom-html
    data:
      html: |
        <div class="container">
          <span class="eyebrow">プライバシーポリシー</span>
          <h1>プライバシーポリシー<span class="cn">VoiceBridge</span></h1>
          <p class="subtitle">最終更新日：2026 年 11 月 2 日 · 発効日：2026 年 11 月 2 日 · VoiceBridge 2.0 以降に適用</p>
          <p class="subtitle"><a href="/privacy.html" hreflang="zh-Hans" lang="zh-Hans">中文</a> · <a href="/privacy_en.html" hreflang="en" lang="en">English</a> · 日本語（各言語版の内容に相違がある場合は、中国語版が優先します）</p>

          <div class="highlight">
            <p>🔒 録音、文字起こし、話者分離、無音判定、検索はすべてお使いの端末上で行われ、<strong>音声がアップロードされることはありません</strong>。クラウド機能をお使いのときに限り、マスク済みのテキストが VoiceBridge のサーバーに送られて処理されます。<strong>VoiceBridge のサーバーはそのテキストを保存せず、学習にも使いません</strong>。クラウド処理には第三者のモデル提供事業者を利用しており、事業者によるデータの取り扱いは各社のプライバシーポリシーに従います（4.5 を参照）。VoiceBridge は第三者の解析や広告を組み込んでおらず、アカウント登録も不要です。</p>
          </div>

          <h2>1. 適用範囲</h2>
          <p>本ポリシーは、VoiceBridge の iOS アプリおよび対応する Apple Watch アプリ（以下あわせて「VoiceBridge」）がお客様のデータをどのように取り扱うかを説明するものです。第 2 節・第 3 節は端末内で完結する処理、第 4 節・第 5 節・第 6 節は端末の外に出るデータと、そのために VoiceBridge のサーバーが保持する情報について説明します。</p>

          <h2>2. 端末上で行う処理</h2>
          <ul>
            <li><strong>録音、文字起こし、話者分離、無音判定、検索</strong>は端末上のモデルで行われ、録音ファイルと文字起こしテキストは端末内に保存されます</li>
            <li><strong>音声はアップロードされません</strong>：録音した音声が VoiceBridge のサーバーや第三者のサーバーに送られることはなく、クラウド機能を使う場合も同じです</li>
            <li>一部の言語では Apple の iOS 端末上音声認識を利用し、端末上での認識を必須に設定しているため（requiresOnDeviceRecognition）、音声が Apple に送られることはありません。この機能は Apple が提供するものです。<a href="https://www.apple.com/jp/legal/privacy/" target="_blank" rel="noopener">Apple のプライバシーポリシー</a>もご確認ください</li>
            <li>認識モデルはサイズが大きいため、初回利用時に Apple のコンテンツ配信ネットワークからダウンロードして端末に保存する場合があります。ダウンロード後の認識にネット接続は不要です</li>
            <li>クラウド機能を使わない場合、録音・文字起こし・検索は機内モードでも利用できます</li>
          </ul>

          <h2>3. Apple Watch での録音</h2>
          <ul>
            <li>Watch で録音した音声は、ペアリングされたお客様ご自身の iPhone 上の VoiceBridge にのみ転送され、VoiceBridge のサーバーは経由しません</li>
            <li>無音判定は端末上でのみ行われます。無音と判定された区間はまずごみ箱に入り、保管期間内であれば試聴や復元ができます。<strong>保管期間が過ぎると、その音声は削除され、復元できません</strong></li>
          </ul>

          <h2>4. クラウド機能（任意）</h2>
          <h3>4.1 対象となる機能</h3>
          <p>校正稿、議事録、一文の推敲、質問、毎日の振り返り、トピック分類、自動整理。これらはクラウドの大規模言語モデルを呼び出す機能で、クレジットで支払います（第 6 節を参照）。使わなくても、VoiceBridge の端末上の機能には影響しません。</p>

          <h3>4.2 送るもの・送らないもの</h3>
          <ul>
            <li><strong>送るのはマスク済みのテキストのみです</strong>：送信前に、VoiceBridge が端末上で用語集に基づいて機微な語をマスクします。ご自身で操作を始める場合は、マスク後のテキストをプレビューしてから送信するかどうかを決められます。自動整理をオンにすると毎回のプレビューはなく、用語集に基づいて自動でマスクされます。新たに見つかった機微な可能性のある語はまとめておき、振り返りの中で一度に確認します</li>
            <li>テキストとあわせて、その処理に必要な補助情報（例：お客様が確認した固有名詞の表記。人名を含む場合があります）を送ることがあります</li>
            <li><strong>音声は送りません</strong></li>
          </ul>

          <h3>4.3 同意と撤回</h3>
          <ul>
            <li>各クラウド機能を初めて使う前に、VoiceBridge はそれぞれ個別に同意を求めます</li>
            <li>質問、毎日の振り返り、トピック分類は複数の会議のテキストをまとめて扱うため、この 3 つは「会議横断のクラウド処理」への同意を共有します</li>
            <li>同意は「マイページ › 利用規約とプライバシー」でいつでも撤回できます。撤回後も、<strong>支払い済みで実行中のタスクは最後まで完了します</strong>が、<strong>新しいクラウド処理は開始されません</strong>。撤回しても端末上の録音やテキストは削除されず、クレジット残高もそのまま残ります。再び使いたいときは、改めて同意してください</li>
          </ul>

          <h3>4.4 VoiceBridge のサーバーでの取り扱い</h3>
          <ul>
            <li>テキストは HTTPS で暗号化されて VoiceBridge のサーバーに送られます。サーバーは「1 回のリクエストにつき 1 回の処理」で動作し、結果はその応答で端末に返されます</li>
            <li><strong>VoiceBridge のサーバーは、送られたテキストと処理結果を保存せず、いかなるモデルの学習にも使いません</strong>。複数ステップのタスクの進行状況と成果物は端末上に保存されます</li>
            <li>VoiceBridge のサーバーは、障害調査と不正利用防止のためにメタデータのみのアクセスログを保持し、<strong>7 日後に削除します</strong>。記録するのは、時刻、デバイスキーのハッシュの先頭 8 文字、リクエスト ID、処理の種類、ステータスコード、<strong>テキストの長さ（内容ではありません）</strong>、モデルの使用量、処理時間です。リクエストとレスポンスの本文はログに書き込みません。これとは別の運用ログには機能の種類と文字数のみ（本文は含みません）を記録し、同じく 7 日後に削除します</li>
          </ul>

          <h3>4.5 第三者のモデル提供事業者</h3>
          <p>テキストの生成そのものは、第三者の大規模モデル提供事業者が行います。VoiceBridge のサーバーはマスク済みのテキストを事業者の API に渡し、結果をお客様に返します。</p>
          <p>渡す内容はその処理に必要なテキストと指示に限られ、<strong>お客様のアカウント識別子やデバイスキーは含みません</strong>。事業者およびそのサーバーは、お客様の国や地域の外にある場合があります。事業者が受け取ったデータをどう扱うか（保持するか、学習に使うかを含む）は各社のプライバシーポリシーと利用規約に従い、VoiceBridge の管理の範囲外です。本ポリシーでいう「保存しない・学習に使わない」は、VoiceBridge のサーバーの動作のみを指します。</p>

          <h2>5. AI アプリに渡す（システムのクリップボード）</h2>
          <p>会議の内容を、お客様が選んだ第三者の AI アプリ（ChatGPT、Claude、Gemini、DeepSeek、Doubao、Kimi、Tongyi Qianwen、Zhipu Qingyan など）に渡して整理することもできます。</p>
          <ul>
            <li>内容はシステムのクリップボードを通じて渡り、お客様ご自身がアプリに貼り付けます。この過程は VoiceBridge のサーバーを経由しません</li>
            <li>初回利用前に同意を求めます。「マイページ › 利用規約とプライバシー」で撤回できます</li>
            <li>第三者の AI アプリに渡ったデータは、そのアプリのプライバシーポリシーに従って取り扱われます</li>
          </ul>

          <h2>6. クレジット、購入、サーバー側の台帳</h2>
          <ul>
            <li><strong>録音、文字起こし、検索、書き出しでクレジットを使うことはありません</strong>。クレジットは第 4 節のクラウド機能にのみ使います</li>
            <li>クレジットは消耗型のアプリ内課金として販売しており、<strong>サブスクリプションではなく、自動更新もされません</strong>。支払いはすべて App Store が処理し、VoiceBridge がお客様のカード情報や Apple アカウント情報に触れることはありません</li>
            <li>残高を管理するため、VoiceBridge のサーバーはクレジット台帳を保持し、次の情報を記録します。
              <ul>
                <li><strong>匿名のアカウント識別子</strong>：VoiceBridge がお客様の端末上でランダムに生成する文字列で、クレジット台帳の識別に使います。VoiceBridge のサーバーが知るのはこの文字列だけで、お名前、メールアドレス、電話番号、Apple アカウントは分かりません</li>
                <li><strong>クレジット残高と購入記録</strong>：App Store の取引 ID、付与されたクレジット数、価格と通貨、日時</li>
                <li><strong>利用記録</strong>：機能の種類、課金対象の文字数、差し引かれたクレジット、日時、タスクの状態（テキストの内容は含みません）</li>
                <li><strong>アカウントとデバイスキーの対応関係</strong>：同じ端末が新規ユーザー向けの特典クレジットを繰り返し受け取るのを防ぐため</li>
              </ul>
            </li>
            <li>これらの情報は、残高の管理とクレジットの差し引き、機種変更時の残高復元、購入の照合と返金への対応、不正利用の防止に使います</li>
            <li>利用記録は 12 か月保持した後、アカウント識別子を含まない月次統計に集約し、明細は削除します</li>
            <li>購入記録（取引 ID、価格と通貨）はアカウントが存続する間保持し、クレジット残高の照合、Apple の返金への対応、会計上の照合に使います。メールで削除をご依頼いただいた場合は 30 日以内に削除します。ただし、法令または Apple との照合義務により保持が必要なものを除きます</li>
          </ul>

          <h2>7. 端末の検証と不正利用の防止</h2>
          <p>クラウドへのリクエストには、Apple の App Attest サービスで生成したデバイスキーを使い、正規の VoiceBridge アプリと実在する端末からのリクエストであることを確認し、利用回数の制限や不正利用の防止に役立てます。デバイスキーはお客様個人を特定するものではなく、アプリをまたいだ追跡には使いません。</p>

          <h2>8. 私たちが行わないこと</h2>
          <ul>
            <li>第三者の解析、広告、トラッキング用 SDK を組み込まず、アプリ内に広告はありません</li>
            <li>アカウント登録は不要で、お名前、メールアドレス、電話番号を収集しません</li>
            <li>お客様のデータを販売しません</li>
          </ul>

          <h2>9. 子どものプライバシー</h2>
          <p>VoiceBridge は 13 歳未満の子どもを対象としておらず、子どもの個人情報を意図的に収集することはありません。</p>

          <h2>10. お客様の選択</h2>
          <ul>
            <li>クラウド機能を使わない場合、録音とテキストは端末上にのみ残ります</li>
            <li>クラウド処理への同意は「マイページ › 利用規約とプライバシー」でいつでも撤回できます</li>
            <li>録音やアプリを削除すると、端末上のデータを削除できます</li>
            <li>匿名のアカウント識別子に紐づく台帳の記録の照会や削除をご希望の場合は、下記のお問い合わせ用メールアドレスまでメールでご連絡ください</li>
          </ul>

          <h2>11. ポリシーの変更</h2>
          <p>本ポリシーを変更する場合は、このページに新しい版を掲載し、日付を更新します。データの利用範囲に関わる重要な変更は、アプリ内でもお知らせします。</p>

          <h2>12. お問い合わせ</h2>
          <p>プライバシーに関するご質問は <a href="mailto:support@voicebridge.top">support@voicebridge.top</a> までお寄せください。</p>
        </div>
