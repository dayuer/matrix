  - type: band
    data:
      id: features
      title: 收费 App 才有的功能，<span class="dim">这里全部免费、全部离线。</span>
      lead: 导入、识别、分离、整理、导出——全流程都在你的 iPhone 本地完成，音频与文字绝不离开设备。
  - type: feature-bento
    data:
      cards:
        - cls: span-3 feature-hero accent
          kicker: 完全免费
          title: 别家要订阅的能力，<br>这里 0 元全开。
          body: 无限时长、无限纪要，功能全部解锁。没有内购、没有广告、没有账号，装好就能用。
          artHtml: |
            <div class="price-tag"><b>¥0</b><em>永久免费 · 无内购 · 无广告</em></div>
        - cls: span-3 feature-hero
          kicker: 100% 离线
          title: 数据不出设备，<br>飞行模式也能转。
          body: SenseVoice 端侧引擎让识别、声纹、语义向量都在本地完成，音频与文字零上传、零追踪、零注册。
          artHtml: |
            <div class="art">
              <div class="offline-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
                <span>100% 离线可用 · 数据不上云</span>
              </div>
            </div>
        - cls: span-3
          kicker: 一键导入
          title: 语音备忘录，分享即转写。
          body: 在系统「语音备忘录」「文件」中选中音频，一键分享到畅译；后台 FIFO 队列排队转写，App 被强杀也能断点续传。
          artHtml: |
            <div class="chips">
              <span class="chip">M4A</span>
              <span class="chip">WAV</span>
              <span class="chip">MP3</span>
            </div>
        - cls: span-3
          kicker: 发言人分离 · 声纹库
          title: 谁说了什么，分得清清楚楚。
          body: pyannote + CAM++ 声纹聚类自动区分多位发言人并标色；声纹库记住常用发言人，新会议导入自动比对匹配。
          artHtml: |
            <div class="art">
              <div class="mini">
                <div class="row"><div class="spk" style="background:#6c5ce7">A</div><div class="txt"><div class="name">发言人 A</div><div class="line w1"></div><div class="line w2"></div></div></div>
                <div class="row"><div class="spk" style="background:#00b894">B</div><div class="txt"><div class="name">发言人 B</div><div class="line w1"></div><div class="line w2"></div></div></div>
              </div>
            </div>
        - cls: span-2
          kicker: 逐字稿文章化
          title: 自动恢复标点。
          body: CT-Transformer 端侧标点恢复 + VAD 语义分段，把识别结果排成通顺文章，而不是一大坨流水账。
        - cls: span-2
          kicker: 本地语义搜索
          title: 按意思找回忆。
          body: 每篇纪要生成设备端句向量，跨会议按语义检索，找那句话不用记原词，全程不联网。
        - cls: span-2
          kicker: PDF 一键导出
          title: 精美纪要随手分享。
          body: 导出带发言人色标、时间线与 AI 摘要卡片的 PDF，也可导出 .txt 文本与原始音频。
        - cls: span-3
          kicker: AI 智能纪要
          title: 一键，整理成结构化纪要。
          body: 内置 6 组提示词模板（纪要、待办、决策、观点、思维导图、会后邮件），一键联动设备上已安装的 AI，结果可归档回畅译长期复用。
          artHtml: |
            <div class="chips">
              <span class="chip"><span class="dot" style="background:#10a37f"></span>ChatGPT</span>
              <span class="chip"><span class="dot" style="background:#d97757"></span>Claude</span>
              <span class="chip"><span class="dot" style="background:#4285f4"></span>Gemini</span>
              <span class="chip"><span class="dot" style="background:#4d6bfe"></span>DeepSeek</span>
              <span class="chip"><span class="dot" style="background:#1c1c1c"></span>豆包 · Kimi · 通义 · 智谱</span>
            </div>
        - cls: span-3
          kicker: 5 语种完全离线
          title: 覆盖你会遇到的语言。
          body: 中英日韩粤 5 大语种由 SenseVoice 完全离线识别，全程不联网；另 7 种经系统语音识别处理，系统支持端侧识别时强制本地完成，不支持时会联网。
          artHtml: |
            <div class="langs">
              <span class="on">中文</span><span class="on">English</span><span class="on">粤语</span><span class="on">日本語</span><span class="on">한국어</span><span>Français</span><span>Deutsch</span><span>Español</span><span>Bahasa</span><span>ภาษาไทย</span><span>Tiếng Việt</span>
            </div>
        - cls: span-6
          kicker: 本地存储 / iCloud 备份（即将推出）
          title: 换设备纪要不丢失，音频始终留在本地。
          body: 支持本地沙盒安全存储。即将推出 iCloud Drive 自动备份：仅同步 .txt 文本，由 Apple 加密传输，音频录音永不上传，随时在设置中开关。
  - type: support-panel
    data:
      id: support
      title: 需要帮助？
      body: 无论是使用问题、功能建议还是其它反馈，我们都乐意倾听。写封邮件，通常一个工作日内回复。
      email: support@voicebridge.top
      faq:
        - q: 我的录音和语音数据会被上传吗？
          a: 不会。核心语音识别完全在你的 iPhone 上完成，录音与转录文本只保存在设备本地沙盒中，不会上传至任何服务器。即使在飞行模式下，核心功能依然可用。
        - q: 这真的是完全免费的吗？有无广告或限制？
          a: 是的，VoiceBridge（畅译）完全免费。我们不包含任何应用内购，不设广告，全部功能全开，没有会议条数或识别时长的任何限制。
        - q: 如何把录音导入畅译？
          a: 在系统「语音备忘录」或「文件」App 中选中音频，通过分享菜单一键分享到畅译即可发起导入；也可在应用内多选文件，后台排队离线转写。支持 M4A、WAV、MP3 等主流格式。
        - q: 「AI 智能纪要」是怎么工作的？
          a: 当你主动使用该功能时，转录文本会通过系统剪贴板传递到你选择的第三方 AI 应用（如 ChatGPT、Claude 等），由你手动粘贴。VoiceBridge 本身不会直接向任何第三方服务器发送网络请求，且首次使用前会征求你的明确同意。
