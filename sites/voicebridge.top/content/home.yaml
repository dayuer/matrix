        featureList:
          - "离线录音转文字"
          - "发言人声纹分离"
          - "逐字稿标点文章化"
          - "本地语义搜索"
          - "AI 智能纪要"
          - "PDF 导出"
          - "中英日韩粤 5 语种完全离线识别"
        publisher:
          "@id": "https://voicebridge.top/#org"
      - "@type": "Organization"
        "@id": "https://voicebridge.top/#org"
        name: "VoiceBridge"
        url: "https://voicebridge.top/"
        email: "support@voicebridge.top"
        logo: "https://voicebridge.top/favicon.svg"
      - "@type": "FAQPage"
        mainEntity:
          - "@type": "Question"
            name: "我的录音和语音数据会被上传吗？"
            acceptedAnswer:
              "@type": "Answer"
              text: "不会。核心语音识别完全在你的 iPhone 上完成，录音与转录文本只保存在设备本地沙盒中，不会上传至任何服务器。即使在飞行模式下，核心功能依然可用。"
          - "@type": "Question"
            name: "这真的是完全免费的吗？有无广告或限制？"
            acceptedAnswer:
              "@type": "Answer"
              text: "是的，VoiceBridge（畅译）完全免费。没有任何应用内购，不设广告，全部功能全开，没有会议条数或识别时长的任何限制。"
          - "@type": "Question"
            name: "如何把录音导入畅译？"
            acceptedAnswer:
              "@type": "Answer"
              text: "在系统「语音备忘录」或「文件」App 中选中音频，通过分享菜单一键分享到畅译即可发起导入；也可在应用内多选文件，后台排队离线转写。"
          - "@type": "Question"
            name: "「AI 智能纪要」是怎么工作的？"
            acceptedAnswer:
              "@type": "Answer"
              text: "当你主动使用该功能时，转录文本会通过系统剪贴板传递到你选择的第三方 AI 应用（如 ChatGPT、Claude 等），由你手动粘贴。畅译本身不会直接向任何第三方服务器发送网络请求，且首次使用前会征求你的明确同意。"
