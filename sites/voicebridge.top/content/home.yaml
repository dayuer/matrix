        applicationCategory: "ProductivityApplication"
        description: "完全免费、100% 离线的录音转文字与 AI 会议纪要 App：导入音频离线识别、自动区分发言人、智能恢复标点排版、本地语义搜索、一键导出 PDF。"
        url: "https://voicebridge.top/"
        image: "https://voicebridge.top/og-image.png"
        inLanguage: "zh-Hans"
        offers:
          "@type": "Offer"
