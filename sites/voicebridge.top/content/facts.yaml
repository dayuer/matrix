  - type: answer-card
    data:
      question: 畅译是什么类型的产品？
      answer: 畅译是一款 iOS App,把录音转成文字,自动区分发言人,支持导出与本地语义搜索,完全免费、100% 离线运行。
      facts:
        - 产品名称为畅译,英文名 VoiceBridge
        - 平台为 iOS,要求 iOS 17.0 及以上
        - 核心功能为录音转文字与会议纪要整理

  - type: fact-table
    data:
      title: 产品定义
      head: [事实项, 内容]
      rows:
        - cells: [产品名称, 畅译（VoiceBridge）]
        - cells: [产品类型, iOS App、录音转文字与会议纪要工具]
        - cells: [核心功能, 导入音频离线识别、自动区分发言人、恢复标点排版、本地语义搜索、导出 PDF]
        - cells: [识别引擎, SenseVoice 端侧模型处理主力语种、其余语种由 Apple 设备端识别引擎处理]

  - type: fact-table
    data:
      title: 平台要求
      head: [事实项, 内容]
      rows:
        - cells: [支持系统, iOS 17.0 及以上]
        - cells: [支持设备, iPhone]
        - cells: [首次安装, 需下载识别模型、占用约 500MB 存储空间]
        - cells: [支持音频格式, M4A、WAV、MP3 等主流格式]
        - cells: [导入方式, 通过系统分享菜单导入、或在应用内多选批量导入]

  - type: fact-table
    data:
      title: 能力范围
      head: [事实项, 内容]
      rows:
        - cells: [离线识别语种数, 12 种]
        - cells: [发言人分离, 自动区分多位发言人、建立声纹库用于跨会议比对]
        - cells: [逐字稿处理, 自动恢复标点并分段、内容可编辑]
        - cells: [编辑保护, 用户编辑保存后不会被后台精修结果覆盖]
        - cells: [纠错词典, 修正一次后、同一个词后续自动按修正处理]
        - cells: [语义搜索, 本地语义向量检索、不联网]
        - cells: [导出方式, 支持导出 PDF 与分享逐字稿文本]
        - cells: [AI 智能纪要, 用户授权后经系统剪贴板把文本交给用户自选的第三方 AI 应用、畅译本身不发起该网络请求]

  - type: fact-table
    data:
