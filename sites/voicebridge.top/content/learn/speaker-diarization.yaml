      html: |
        <h1 class="doc-title">说话人分离为什么会认错人</h1>
        <p class="doc-sub">张冠李戴的锅，九成时候不在聚类算法，而在更早的切分那一步。</p>

  # 出处：Sources/Services/SpeakerDiarizationEngine.swift:4-14（头注释）
  - type: answer-card
    data:
      question: 会议转录里说话人对不上号，是哪一步出的错？
      answer: 多数时候不是声纹模型分不清人，而是切分粒度太粗——把一整段包含多人接话的语音当成一个单位处理，后面无论换哪种聚类算法，错误都已经写进数据里了。畅译把切分交给模型在音频层直接定位话轮边界，而不是靠文本语义去猜。
      facts:
        - 旧方案：VAD 段落 + 段级 AHC 聚类，固定阈值在不同音频上表现不稳
        - 新方案：pyannote segmentation-3.0 做话轮/重叠切分，再对每个话轮提声纹聚类
        - 声纹模型用 CAM++ zh_en advanced——sherpa-onnx 库内唯一的中英联合声纹模型
        - 聚类与拆分逻辑收敛到单一 Service，避免历史上出现过的多份实现不一致

  # 出处：Sources/Services/SpeakerDiarizationEngine.swift:4-9（头注释，旧方案问题描述）
  - type: prose
    data:
      html: |
        <h2>旧方案错在哪</h2>
        <p>VAD（语音活动检测）负责把连续录音切成「有人在说话」和「静音」两类区间，早期的说话人分离就以 VAD 切出的每一段为单位，跑一次 AHC（层次聚类：不断合并最相似的两个聚类，直到收敛）来判断这段属于谁。</p>
        <p>问题出在切分粒度上。一段 VAD 区间里如果出现两个人接话——讨论、抢话、你一句我一句是会议里的常态——整段音频也只能标一个说话人。转录结果里，这段话会被完整归到其中一人名下，产品呈现出来就是发言人 A 说了本该属于 A 和 B 两人的话，会议纪要里的观点直接张冠李戴。同时，AHC 的合并阈值是固定的，不同录音的信噪比、说话人音色差异，会让同一个阈值在一份录音上偏松、在另一份上偏紧，聚类效果本身也不稳定。</p>

  # 出处：Sources/Services/SpeakerDiarizationEngine.swift:6-9,14（头注释，新方案与调用链）
  - type: prose
    data:
      html: |
        <h2>切分要交给模型定位边界，不能靠文本语义推断</h2>
        <p>现在的架构把切分这一步单独拿出来，交给 pyannote segmentation-3.0——一个专门训练来识别「谁在什么时间点开始说话、结束说话」的模型，包括两人重叠说话的区间。它在音频层面直接工作，不需要等文本转录完成之后再回头去猜「这句话的措辞风格更像谁」。</p>
        <p>这是和旧方案根本性的差异：错误的高发点从聚类环节前移到了切分环节，而切分现在由专门的模型完成，不再是启发式规则或事后的文本分析。切完话轮之后，再逐话轮提取声纹、做全局聚类，说话人切换点由模型定位而非靠文本语义推断，从根本上减少了归因错误——这也是整段管线里最值得强调的一句话：<strong>切分是原因，聚类只是结果的放大器</strong>。</p>

  # 出处：Sources/Services/SpeakerDiarizationEngine.swift:11-12（头注释，语言覆盖）
  - type: prose
    data:
      html: |
        <h2>双语场景下，选择余地为零</h2>
        <p>声纹模型选定 CAM++ zh_en advanced，理由很直接：它是 sherpa-onnx 库内唯一的中英联合声纹模型。畅译的实际使用场景里，中英混说不是边缘情况——技术会议、留学场景下大量对话本身就是中英夹杂的。这里的选型不是「在几个候选里挑最好的」，而是「只有它能同时覆盖两种语言还不掉链子」，中文和英文任何一边都不需要为另一边让步。</p>

  # 出处：Sources/Services/DiarizationService.swift:1-6
  - type: prose
    data:
      html: |
        <h2>算法必须单点收敛</h2>
        <p>历史上，说话人聚类与段落拆分的逻辑曾经同时存在于两处独立实现里——会议详情页的 ViewModel 是一份，批量导入队列又是另一份。两份实现只要出现细微差异，就会产生「同一段音频，走不同调用路径得到不同结果」的情况，历史上这直接导致过一次丢字 bug。</p>
        <p>现在这套逻辑被收敛进一个专门的 Service，源码注释里写得很明确：这是聚类逻辑的唯一真理源，所有调用方都必须经它执行聚类与拆分，不允许各自维护一份。这里的教训不在算法层面：同一个算法存在两份实现，比算法本身不够精确更危险，因为它产生的是不可预测的不一致，而不是一个可以被量化、被改进的误差。</p>

