  - type: prose
    data:
      html: |
        <h1 class="doc-title">机器改和人改会打架</h1>
        <p class="doc-sub">AI 产物的编辑权必须明确归属，否则用户的修改会被下一轮自动处理静默吃掉。</p>

  # 出处：Sources/Models/MeetingRecord.swift:210-227；Sources/Services/TranscriptCorrectionPass.swift:6-8,50
  - type: answer-card
    data:
      question: 用户手动改过的转录文字，为什么还会被系统悄悄改回去？
      answer: 因为转录文本会被多个自动流程反复触碰——精修、词典纠正、话轮重建都可能重写同一段文字。如果没有一条明确的「谁改过就不准再覆盖」的规则，用户刚改完的内容下一轮处理就可能被冲掉，用户完全不会察觉发生了什么。畅译用一个编辑状态机把这件事锁死。
      facts:
        - 每个转录段落有独立的编辑状态：原始识别 / 精修过 / 用户改过
        - 用户编辑后该段落对后台管线加锁，后台自动流程一律跳过
        - 高亮层只做视觉标记，绝不接收点击——单击段落进入编辑是产品既定规则
        - 一个被否决的产品方案：独立校对界面，后来并入了逐字稿本身

  # 出处：Sources/Models/MeetingRecord.swift:152-162,210-227
  - type: prose
    data:
      html: |
        <h2>谁改的，谁说了算</h2>
        <p>一段转录文字在它的生命周期里可能被写入好几次：ASR 识别出来是第一次；后台精修流程覆盖是第二次；词典自动纠正错别字是第三次；用户自己手动改一次是第四次。如果这几次写入互相不知道对方的存在，后面发生的写入会无条件覆盖前面的——包括覆盖掉用户刚做的修改。</p>
        <p>畅译给每个段落挂一个编辑状态：诞生时是「原始」，被后台管线覆盖过变成「精修」，被用户手动改过变成「用户已编辑」。后台管线在写回之前只做一个判断：这段是否被用户编辑过，是就跳过，不管精修结果看起来多「对」。这不是精修逻辑做得不够好，是编辑权归属的问题——一旦用户接管了这段文字，它就不再是机器该管的范围。</p>

  # 出处：Sources/Views/SelectableText.swift:21-22,78-79
  - type: prose
    data:
      html: |
        <h2>高亮层绝不能接收点击</h2>
        <p>校对场景下，系统会在文字上做视觉标记：自动纠正过的地方用底色标出来，还没确认的建议用下划线标出来。这层标记只做视觉展示，源码注释里写得很明确：不接收任何点击手势，也不能改变单击行为。</p>
        <p>原因是产品交互的既定规则——单击一段文字就是进入编辑状态、光标落在点击位置，这条约定贯穿整个逐字稿页面。如果高亮层自己再监听一层点击去做别的事（比如点高亮直接弹出建议），就会和「单击进入编辑」这条全局规则打架，用户会遇到点哪里进哪个模式说不清楚的体验。所以高亮和交互被严格分成两层，互不干扰，这是一条产品红线，不是实现细节。</p>

  # 出处：Sources/ViewModels/MeetingSummaryViewModel.swift:697-701
  - type: prose
    data:
      html: |
        <h2>段落被拆开之后，原文快照怎么办</h2>
        <p>用户可以在编辑态把一段话从中间拆成两段。拆开之后，两个新段落各自需要一份「原文快照」，用于「还原到识别结果」这个功能。做法是：两个新段落分别以自己当前的文本内容作为新的原文快照重新设定基线，而不是尝试从旧的整段快照里去掉前半段或后半段、拼出两份对应新段落的「原始状态」。</p>
        <p>原因很直接：一段完整原文没办法干净地对半拆成两份、分别对应新段落各自的原始状态——拆分点落在字符层面，原来的语义和标点结构未必能被这样切开。与其保留一份拆不干净的历史快照，不如接受「拆分是一次新的起点」，重新计起。</p>

  # 出处：Sources/Views/MeetingSummaryView.swift:1348-1349,1601-1602,1859-1862
  - type: prose
    data:
      html: |
        <h2>一个被否决的方案，和它教会我们的事</h2>
        <p>早期版本里，校对是一个独立于逐字稿之外的界面，有自己的控制条，包括倍速播放和逐段停顿播放。这个方案后来被否决、删除了——校对功能并入了逐字稿页面本身：自动纠正的建议变成内联在文字里的可点击标签，一点就替换，不用长按选中文字，也不用切换界面。原独立界面里「倍速」「逐段停」这两个还有价值的控制项，被直接搬到了逐字稿播放器卡片上，不再保留一个专门放这两个按钮的独立页面。</p>
        <p>这次调整教会的是：两个功能若操作的是同一份数据，让用户在两个界面之间切换去处理它，不是「拆分清楚」，是给同一件事制造了两个入口、两套状态。最终增加的不是清晰度，是用户要记住「我现在在哪个界面改」的负担。</p>

