blocks:
  - type: breadcrumb
    data:
      items:
        - text: 首页
          href: /
        - text: 更新记录

  - type: prose
    data:
      html: |
        <h1 class="doc-title">更新记录</h1>
        <p class="doc-sub">这页记录畅译版本里能确认落地的能力变化，持续更新，暂时只收录一条。</p>

  - type: answer-card
    data:
      question: 畅译最近一次值得记的更新是什么？
      answer: 1.4 版本加入了逐字稿的校对与纠错词典能力：修正一处识别错误后，同一个词后续会自动按你的修正来，不用每次重复改。
      facts:
        - 逐字稿支持人工校对，改动不会被后台精修覆盖
        - 纠错词典记住你的修正，同一个词后续自动纠正
        - 这两项都在设备本地完成，不涉及联网

  - type: prose
    data:
      html: |
        <h2>1.4 — 校对与纠错词典</h2>
        <p>逐字稿本来就能直接点开编辑，1.4 版本在这基础上加了纠错词典：把一个反复被识别错的词改对一次，后续同一个词再出现，系统会自动按你的修正处理，不用每篇文稿都重新改一遍。这一层校对逻辑写在<a href="/learn/transcript-editing/">逐字稿编辑架构</a>里。</p>

  - type: prose
    data:
      html: |
        <h2>关于这页</h2>
        <p>这页只收录能确认落地、且不会随时间失真的更新条目，不列具体的发布日期和版本号细节，避免写错。后续有新的确定性变化会补充在这里。</p>

  - type: related-links
    data:
      title: 相关阅读
      items:
