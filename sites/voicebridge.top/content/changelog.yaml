          href: /learn/transcript-editing/
          desc: 精修永不覆盖用户编辑,单段编辑模型只在提交时写一次
        - text: 识别出文字只是开始
          href: /learn/asr-postprocessing/
          desc: 标点恢复与语义分段怎么做
        - text: 常见问题
          href: /faq/
