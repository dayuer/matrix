path: /support.html
template: page
meta:
  title: VoiceBridge 畅译 — 技术支持与常见问题
  description: VoiceBridge（畅译）技术支持：联系邮箱、常见问题与系统要求。完全免费、100% 离线的录音转文字与会议纪要，数据不上传，遇到问题欢迎来信。
  keywords: VoiceBridge,畅译,技术支持,常见问题,FAQ,联系我们,帮助
  canonical: /support.html
  priority: 0.8
  changefreq: monthly
  alternates:
    - hreflang: zh-Hans
      href: /support.html
    - hreflang: en
      href: /support_en.html
    - hreflang: x-default
      href: /support.html
  jsonLd:
    "@context": "https://schema.org"
    "@type": "FAQPage"
    inLanguage: "zh-Hans"
    mainEntity:
      - "@type": "Question"
        name: "需要联网才能使用吗？"
        acceptedAnswer:
          "@type": "Answer"
          text: "不需要。VoiceBridge 搭载 SenseVoice 端侧 AI 引擎，核心的录音和语音转文字功能完全离线运行，飞行模式下也能正常使用。"
      - "@type": "Question"
        name: "支持哪些语言？"
        acceptedAnswer:
          "@type": "Answer"
          text: "离线支持中文、英语、日语、韩语、粤语、法语、德语、西班牙语共 8 种语言。通过 iOS 原生引擎还支持印尼语、泰语、越南语、马来语等更多语种。"
      - "@type": "Question"
        name: "我的录音数据安全吗？"
        acceptedAnswer:
          "@type": "Answer"
          text: "绝对安全。所有录音和转录文本仅存储在您的设备本地，不会上传至任何服务器。我们不收集任何个人信息。"
      - "@type": "Question"
        name: "这真的是完全免费的吗？有无广告或限制？"
        acceptedAnswer:
          "@type": "Answer"
          text: "是的，VoiceBridge（畅译）完全免费。我们不包含任何应用内购，不设广告，全部功能（包含声纹发言人库、iCloud 自动备份、PDF 导出等）全部无限制开放，没有任何时长限制。"
      - "@type": "Question"
        name: "删除 App 会导致我的会议纪要丢失吗？"
        acceptedAnswer:
          "@type": "Answer"
          text: "会。由于 VoiceBridge 100% 离线运行，所有会议录音和转录文本仅保存在您 iPhone 本地的安全沙盒中。卸载 App 将会彻底清除这些本地数据。请在卸载前通过 PDF/TXT 导出功能对重要数据进行备份。"
blocks:
  - type: custom-html
    data:
      html: |
        <div class="container">
          <span class="eyebrow">技术支持</span>
          <h1>技术支持<span class="cn">VoiceBridge · 畅译</span></h1>
          <p class="subtitle">完全免费 · 离线 AI 会议纪要 · 隐私优先</p>

          <div class="contact-card">
            <h3>📧 联系我们</h3>
            <p>遇到问题或有建议？发送邮件给我们，通常一个工作日内回复。</p>
            <a class="contact-btn" href="mailto:support@voicebridge.top">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/></svg>
              support@voicebridge.top
            </a>
          </div>

          <h2>常见问题</h2>
          <div class="faq">
            <details>
              <summary>需要联网才能使用吗？</summary>
              <div class="a">不需要。VoiceBridge 搭载 SenseVoice 端侧 AI 引擎，核心的录音和语音转文字功能完全离线运行，飞行模式下也能正常使用。</div>
            </details>
            <details>
              <summary>支持哪些语言？</summary>
              <div class="a">离线支持中文、英语、日语、韩语、粤语、法语、德语、西班牙语共 8 种语言。通过 iOS 原生引擎还支持印尼语、泰语、越南语、马来语等更多语种。</div>
            </details>
            <details>
              <summary>我的录音数据安全吗？</summary>
              <div class="a">绝对安全。所有录音和转录文本仅存储在您的设备本地，不会上传至任何服务器。我们不收集任何个人信息。详见我们的<a href="privacy.html">隐私政策</a>。</div>
            </details>
            <details>
              <summary>这真的是完全免费的吗？有无广告或限制？</summary>
              <div class="a">是的，VoiceBridge（畅译）完全免费。我们不包含任何应用内购，不设广告，全部功能（包含声纹发言人库、本地自动备份、PDF 导出等）全部无限制开放，没有任何时长限制。</div>
            </details>
            <details>
              <summary>删除 App 会导致我的会议纪要丢失吗？</summary>
              <div class="a">会。由于 VoiceBridge 100% 离线运行，所有会议录音和转录文本仅保存在您 iPhone 本地的安全沙盒中。卸载 App 将会彻底清除这些本地数据。请在卸载前通过 PDF/TXT 导出功能对重要数据进行备份。</div>
            </details>
          </div>

          <h2>系统要求</h2>
          <div class="sysreq">
            <p>📱 iPhone · iOS 17.0 或更高版本<br>💾 至少 500MB 可用存储空间（AI 模型文件）</p>
          </div>
        </div>
