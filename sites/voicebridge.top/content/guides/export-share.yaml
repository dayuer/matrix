  - type: prose
    data:
      html: |
        <h1 class="doc-title">逐字稿怎么导出 PDF、怎么分享出去</h1>
        <p class="doc-sub">转完的文字稿总要发给人看，畅译留了两条路：一份排版好的 PDF，或者一段能直接粘贴的纯文本。</p>

  - type: answer-card
    data:
      question: 转写结果能导出吗？能发给没装畅译的人吗？
      answer: 能。逐字稿支持导出带发言人色标的 PDF，也能导出纯文本 txt，导出之后通过系统分享菜单发给任何人，对方不需要装畅译也能打开。原始音频也可以一并导出带走。
      facts:
        - 支持导出带发言人色标、排好版的 PDF
        - 也能导出纯文本 txt，方便复制粘贴进邮件或文档
        - 原始录音音频可以单独导出，归档或者转发给需要复核的人
        - 导出走系统分享菜单，接收方不需要安装畅译

  - type: prose
    data:
      html: |
        <h2>PDF 和文本，怎么选</h2>
        <p>要发给不方便读一大段无格式文字的同事或客户，PDF 更合适：带着发言人色标，一眼看出来谁说了什么。要把内容粘贴进邮件正文、会议纪要文档或者别的编辑器，纯文本更方便，不用先转格式。两种导出对应的是同一份逐字稿，内容不会有差别，只是呈现形式不同。</p>

  - type: step-list
    data:
      title: 具体怎么操作
      steps:
        - name: 打开要导出的逐字稿
          text: 在畅译里打开转写完成的那份逐字稿。
        - name: 找到导出入口
          text: 在这份逐字稿的操作入口里找到导出选项。
        - name: 选择导出格式
          text: 按需要选择导出带发言人色标的 PDF，或者导出纯文本 txt。
          tip: 需要复核原始录音的话，原始音频也能单独导出。
        - name: 通过分享菜单发送出去
          text: 导出生成后，用系统分享菜单发给同事，或者存到文件、云盘里。

  - type: prose
    data:
      html: |
        <h2>常见问题</h2>
        <p><b>接收方需要装畅译才能看吗？</b>不需要。PDF 和 txt 都是通用格式，用系统自带的预览、文档或邮件 App 就能打开。</p>
        <p><b>导出的 PDF 里能看出是谁说的话吗？</b>能，多人对话导出的 PDF 带着发言人色标，跟应用内看到的区分是一致的。</p>
        <p><b>只想要文字，不想带音频，可以吗？</b>可以，PDF 和 txt 都只包含转写文字，音频是单独的导出选项，按需要选择即可。</p>

