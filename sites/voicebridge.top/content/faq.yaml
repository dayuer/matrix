path: /faq
template: article
meta:
  title: 常见问题 — VoiceBridge 畅译
  description: 畅译（VoiceBridge）常见问题汇总：是否上传录音、是否收费、如何导入、支持哪些语言、识别错了能不能改、AI 智能纪要怎么用、卸载会不会丢数据。
  keywords: 畅译常见问题,VoiceBridge FAQ,录音转文字问题,离线转录,VoiceBridge,畅译
  canonical: "/faq/"
  bodyClass: doc
  priority: 0.8
  changefreq: monthly
  jsonLd:
    "@context": "https://schema.org"
    "@graph":
      - "@type": "BreadcrumbList"
        itemListElement:
          - "@type": "ListItem"
            position: 1
            name: "首页"
            item: "https://voicebridge.top/"
          - "@type": "ListItem"
            position: 2
            name: "常见问题"
            item: "https://voicebridge.top/faq/"
      - "@type": "FAQPage"
        mainEntity:
          - "@type": "Question"
            name: "我的录音和语音数据会被上传吗？"
            acceptedAnswer:
              "@type": "Answer"
              text: "不会。核心语音识别完全在你的 iPhone 上完成，录音与转录文本只保存在设备本地沙盒中，不会上传至任何服务器。即使在飞行模式下，核心功能依然可用。"
          - "@type": "Question"
            name: "这真的是完全免费的吗？有无广告或限制？"
            acceptedAnswer:
              "@type": "Answer"
              text: "是的，VoiceBridge（畅译）完全免费。没有任何应用内购，不设广告，全部功能全开，没有会议条数或识别时长的任何限制。"
          - "@type": "Question"
            name: "如何把录音导入畅译？"
            acceptedAnswer:
              "@type": "Answer"
              text: "在系统「语音备忘录」或「文件」App 中选中音频，通过分享菜单一键分享到畅译即可发起导入；也可在应用内多选文件，后台排队离线转写。"
          - "@type": "Question"
            name: "「AI 智能纪要」是怎么工作的？"
            acceptedAnswer:
              "@type": "Answer"
              text: "当你主动使用该功能时，转录文本会通过系统剪贴板传递到你选择的第三方 AI 应用（如 ChatGPT、Claude 等），由你手动粘贴。畅译本身不会直接向任何第三方服务器发送网络请求，且首次使用前会征求你的明确同意。"
          - "@type": "Question"
            name: "需要联网才能使用吗？"
            acceptedAnswer:
              "@type": "Answer"
              text: "不需要。VoiceBridge 搭载 SenseVoice 端侧 AI 引擎，核心的录音和语音转文字功能完全离线运行，飞行模式下也能正常使用。"
          - "@type": "Question"
            name: "我的录音数据安全吗？"
            acceptedAnswer:
              "@type": "Answer"
              text: "绝对安全。所有录音和转录文本仅存储在您的设备本地，不会上传至任何服务器。我们不收集任何个人信息。"
          - "@type": "Question"
            name: "删除 App 会导致我的会议纪要丢失吗？"
            acceptedAnswer:
              "@type": "Answer"
              text: "会。由于 VoiceBridge 100% 离线运行，所有会议录音和转录文本仅保存在您 iPhone 本地的安全沙盒中。卸载 App 将会彻底清除这些本地数据。请在卸载前通过 PDF/TXT 导出功能对重要数据进行备份。"
          - "@type": "Question"
            name: "支持哪些语言识别？"
            acceptedAnswer:
              "@type": "Answer"
              text: "畅译支持 12 种语言的离线识别。中文、英语、粤语、日语、韩语等主力语种由 SenseVoice 引擎本地识别，其余语种由 Apple 系统自带的设备端识别引擎处理，同样不联网、不上传。"
          - "@type": "Question"
            name: "识别错的字可以自己改吗？改完会不会被覆盖？"
            acceptedAnswer:
              "@type": "Answer"
              text: "可以。逐字稿里的任何一句都能直接点开编辑，改完保存后不会被后台精修结果覆盖。人名、专业术语这类容易识别错的词，还可以加进纠错词典，改一次之后同一个词自动按你的修正来。"
          - "@type": "Question"
            name: "支持哪些录音格式导入？"
            acceptedAnswer:
              "@type": "Answer"
              text: "支持 M4A、WAV、MP3 等主流格式。可以从系统「语音备忘录」或「文件」App 用分享菜单一键导入，也能在应用内多选批量导入。"
          - "@type": "Question"
            name: "手机需要满足什么条件？"
            acceptedAnswer:
              "@type": "Answer"
              text: "需要 iOS 17.0 或更高版本。首次安装时要下载识别模型，占用大约 500MB 存储空间，之后不管转多少次都不用再重新下载。"
          - "@type": "Question"
            name: "多人对话能自动分清是谁说的吗？"
            acceptedAnswer:
              "@type": "Answer"
              text: "能。畅译会自动区分发言人并建立声纹库，同一个人下次开会再出现时，系统会尝试比对匹配。具体的切分原理和容易认错人的原因，写在说话人分离一文里。"
  ogType: article
