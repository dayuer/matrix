      appstore:
        href: '#'
        label: Download VoiceBridge on the App Store
        small: Download on the
        big: App Store
      secondary:
        text: Explore all features
        href: '#features'
      trust:
        - '<b>$0</b> Completely free'
        - No ads · No in-app purchases
        - No sign-up
      artHtml: |
        <svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoiceBridge transcription interface preview with speaker-labeled meeting notes">
