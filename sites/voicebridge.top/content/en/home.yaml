path: /index_en.html
template: home
meta:
  lang: en
  title: VoiceBridge — Free, 100% Offline Voice-to-Text & AI Meeting Notes
  description: 'VoiceBridge is a completely free, 100% on-device app that turns any recording into text: offline transcription, automatic speaker separation, punctuation & article formatting, local semantic search, and one-tap PDF export. Your audio never leaves your iPhone — no ads, no in-app purchases, no sign-up.'
  keywords: voice to text, meeting notes, transcription, offline transcription, speaker diarization, AI notes, PDF export, semantic search, free, VoiceBridge
  canonical: /index_en.html
  priority: 1.0
  changefreq: weekly
  alternates:
    - hreflang: zh-Hans
      href: /
    - hreflang: en
      href: /index_en.html
    - hreflang: x-default
      href: /
  jsonLd:
    "@context": "https://schema.org"
    "@graph":
      - "@type": "SoftwareApplication"
        name: "VoiceBridge"
        operatingSystem: "iOS 17.0+"
        applicationCategory: "ProductivityApplication"
        description: "A completely free, 100% on-device app that turns any recording into text: offline transcription, automatic speaker separation, punctuation & article formatting, local semantic search, and one-tap PDF export."
        url: "https://voicebridge.top/index_en.html"
        image: "https://voicebridge.top/og-image.png"
        inLanguage: "en"
        offers:
          "@type": "Offer"
          price: "0"
          priceCurrency: "USD"
        featureList:
          - "Offline voice-to-text"
          - "Speaker separation with voiceprint"
          - "Punctuation & article formatting"
          - "Local semantic search"
          - "AI meeting notes"
          - "PDF export"
          - "12 offline languages"
        publisher:
          "@id": "https://voicebridge.top/#org"
      - "@type": "Organization"
        "@id": "https://voicebridge.top/#org"
        name: "VoiceBridge"
        url: "https://voicebridge.top/"
        email: "support@voicebridge.top"
        logo: "https://voicebridge.top/favicon.svg"
      - "@type": "FAQPage"
        mainEntity:
          - "@type": "Question"
            name: "Are my recordings and voice data uploaded?"
            acceptedAnswer:
              "@type": "Answer"
              text: "No. Core speech recognition runs entirely on your iPhone. Recordings and transcripts are stored only in the app's local sandbox and are never uploaded to any server. Core features work even in Airplane Mode."
          - "@type": "Question"
            name: "Is VoiceBridge really completely free? Are there any ads or limits?"
            acceptedAnswer:
              "@type": "Answer"
              text: "Yes, VoiceBridge is completely free. We have no in-app purchases, no ads, all features are fully unlocked, and there are no limits on the number of meetings or transcription duration."
          - "@type": "Question"
            name: "How do I import a recording into VoiceBridge?"
            acceptedAnswer:
              "@type": "Answer"
              text: "Select an audio file in the system Voice Memos or Files app and share it to VoiceBridge to start an import; or pick multiple files inside the app to queue them for offline transcription. M4A, WAV, and MP3 are supported."
          - "@type": "Question"
            name: "How does AI Meeting Notes work?"
            acceptedAnswer:
              "@type": "Answer"
              text: "When you choose to use it, your transcript is passed via the system clipboard to a third-party AI app of your choice (such as ChatGPT or Claude) for you to paste manually. VoiceBridge itself sends no network requests to any third-party server, and asks for your explicit consent before first use."
