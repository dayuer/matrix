  - type: band
    data:
      id: features
      title: The features paid apps charge for, <span class="dim">all free and all offline.</span>
      lead: Import, recognize, separate, organize, export — every step runs locally on your iPhone. Audio and text never leave the device.
  - type: feature-bento
    data:
      cards:
        - cls: span-3 feature-hero accent
          kicker: Completely free
          title: What others gate behind a subscription — unlocked for $0.
          body: Unlimited duration, unlimited transcripts, every feature open. No in-app purchases, no ads, no account. Install and go.
          artHtml: |
            <div class="price-tag"><b>$0</b><em>Free forever · No IAP · No ads</em></div>
        - cls: span-3 feature-hero
          kicker: 100% offline
          title: Nothing leaves the device — works in Airplane Mode.
          body: 'The SenseVoice on-device engine runs recognition, voiceprints, and semantic vectors locally. Audio and text: zero uploads, zero tracking, zero sign-up.'
          artHtml: |
            <div class="art">
              <div class="offline-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
                <span>100% offline · Nothing leaves the device</span>
              </div>
            </div>
        - cls: span-3
          kicker: One-tap import
          title: Share from Voice Memos, transcribe instantly.
          body: Pick audio in the system Voice Memos or Files app and share it to VoiceBridge. A background FIFO queue processes files and resumes even if the app is force-quit.
          artHtml: |
            <div class="chips">
              <span class="chip">M4A</span>
              <span class="chip">WAV</span>
              <span class="chip">MP3</span>
            </div>
        - cls: span-3
          kicker: Speaker separation · Voiceprint library
          title: Who said what, sorted out clearly.
          body: pyannote + CAM++ voiceprint clustering separates multiple speakers and color-codes them; the voiceprint library remembers regulars and auto-matches them in new imports.
          artHtml: |
            <div class="art">
              <div class="mini">
                <div class="row"><div class="spk" style="background:#6c5ce7">A</div><div class="txt"><div class="name">Speaker A</div><div class="line w1"></div><div class="line w2"></div></div></div>
                <div class="row"><div class="spk" style="background:#00b894">B</div><div class="txt"><div class="name">Speaker B</div><div class="line w1"></div><div class="line w2"></div></div></div>
              </div>
            </div>
        - cls: span-2
          kicker: Article formatting
          title: Punctuation, restored.
          body: An on-device CT-Transformer model plus VAD segmentation turn raw output into readable articles — not one endless run-on block.
        - cls: span-2
          kicker: Local semantic search
          title: Search by meaning.
          body: Each transcript gets on-device sentence vectors, so you can search across meetings by meaning without recalling the exact words — all offline.
        - cls: span-2
          kicker: One-tap PDF export
          title: Polished notes to share.
          body: Export a PDF with speaker colors, a timeline, and AI summary cards — or export .txt and the original audio.
        - cls: span-3
          kicker: AI Meeting Notes
          title: One tap to structured notes.
          body: Six built-in prompt templates (notes, action items, decisions, key points, mind map, follow-up email) hand off to an AI app installed on your device; results archive back into VoiceBridge for reuse.
          artHtml: |
            <div class="chips">
              <span class="chip"><span class="dot" style="background:#10a37f"></span>ChatGPT</span>
              <span class="chip"><span class="dot" style="background:#d97757"></span>Claude</span>
              <span class="chip"><span class="dot" style="background:#4285f4"></span>Gemini</span>
              <span class="chip"><span class="dot" style="background:#4d6bfe"></span>DeepSeek</span>
              <span class="chip"><span class="dot" style="background:#1c1c1c"></span>Doubao · Kimi · more</span>
            </div>
        - cls: span-3
          kicker: 12 offline languages
          title: Covers the languages you meet in.
          body: Chinese, English, Cantonese, Japanese, and Korean run fully offline on SenseVoice; seven more use Apple's on-device recognition, forced never to upload.
          artHtml: |
            <div class="langs">
              <span class="on">中文</span><span class="on">English</span><span class="on">粤语</span><span class="on">日本語</span><span class="on">한국어</span><span>Français</span><span>Deutsch</span><span>Español</span><span>Bahasa</span><span>ภาษาไทย</span><span>Tiếng Việt</span>
            </div>
        - cls: span-6
          kicker: Local Storage / iCloud Backup (Coming Soon)
          title: Transcripts follow you across devices. Audio stays local.
          body: 'Secure local sandbox storage is supported. iCloud Drive automatic backup is coming soon: only .txt files sync, encrypted by Apple in transit, while audio recordings are never uploaded. Toggled anytime in Settings.'
  - type: support-panel
    data:
      id: support
      title: Need a hand?
      body: Whether it's a how-to, a feature idea, or other feedback, we're glad to hear it. Drop us an email — we usually reply within one business day.
      email: support@voicebridge.top
      faq:
        - q: Are my recordings and voice data uploaded?
          a: No. Core speech recognition runs entirely on your iPhone. Recordings and transcripts are stored only in the app's local sandbox and are never uploaded to any server. Core features work even in Airplane Mode.
        - q: Is VoiceBridge really completely free? Are there any ads or limits?
          a: Yes, VoiceBridge is completely free. We have no in-app purchases, no ads, all features are fully unlocked, and there are no limits on the number of meetings or transcription duration.
        - q: How do I import a recording into VoiceBridge?
          a: Select an audio file in the system Voice Memos or Files app and share it to VoiceBridge to start an import; or pick multiple files inside the app to queue them for offline transcription. M4A, WAV, and MP3 are supported.
        - q: How does AI Meeting Notes work?
          a: When you choose to use it, your transcript is passed via the system clipboard to a third-party AI app of your choice (such as ChatGPT or Claude) for you to paste manually. VoiceBridge itself sends no network requests to any third-party server, and asks for your explicit consent before first use.

