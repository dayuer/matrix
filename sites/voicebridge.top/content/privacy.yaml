blocks:
  - type: custom-html
    data:
      html: |
        <div class="container">
          <span class="eyebrow">隐私政策</span>
          <h1>隐私政策<span class="cn">VoiceBridge · 畅译</span></h1>
          <p class="subtitle">最后更新：2026 年 11 月 2 日 · 生效日期：2026 年 11 月 2 日 · 适用于畅译 2.0 及以上版本</p>
          <p class="subtitle">中文 · <a href="/privacy_en.html" hreflang="en" lang="en">English</a> · <a href="/privacy_ja.html" hreflang="ja" lang="ja">日本語</a>（各语言版本如有出入，以中文版为准）</p>

          <div class="highlight">
            <p>🔒 录音、转写、说话人分离、无人声判定与搜索都在您的设备上完成，<strong>原音永不上传</strong>。只有在您使用云端功能时，打码后的文字才会发送到畅译服务器处理；<strong>畅译服务器不存储这些文字，也不将其用于训练</strong>。云端处理需调用第三方模型服务商，服务商对数据的处理另受其各自隐私政策约束（详见第 4.5 节）。畅译不接入第三方统计或广告，使用畅译不需要注册账号。</p>
          </div>

          <h2>1. 适用范围</h2>
          <p>本政策说明 VoiceBridge（畅译）iOS App 及配套 Apple Watch App（以下合称「畅译」）如何处理您的数据。第 2、3 节是只在您设备上进行的处理；第 4、5、6 节是会离开设备的数据，以及畅译服务器为此保存的信息。</p>

          <h2>2. 在您设备上完成的处理</h2>
          <ul>
            <li><strong>录音、转写、说话人分离、无人声判定与搜索</strong>均由设备上的端侧模型完成，录音文件与转写文字保存在设备本地</li>
            <li><strong>原音永不上传</strong>：录音音频不会发送到畅译服务器或任何第三方服务器，云端功能也不例外</li>
            <li>部分语种使用 Apple iOS 设备端语音识别，并强制要求在设备上识别（requiresOnDeviceRecognition），音频不发送给 Apple；该能力由 Apple 提供，参见 <a href="https://www.apple.com/legal/privacy/" target="_blank" rel="noopener">Apple 隐私政策</a></li>
            <li>识别模型体量较大，首次使用时可能需要从 Apple 的内容分发网络下载并保存在本机；下载完成后识别不需要联网</li>
            <li>不使用云端功能时，录音、转写与搜索在飞行模式下也能使用</li>
          </ul>

          <h2>3. Apple Watch 录音</h2>
          <ul>
            <li>手表上的录音只传到与之配对的、您自己的 iPhone 上的畅译，不经过畅译服务器</li>
            <li>无人声判定只在本机进行。判为无人声的片段先进入回收区，回收期内可以试听或恢复；<strong>回收期满后，对应原音即被删除，不能恢复</strong></li>
          </ul>

          <h2>4. 云端功能（可选）</h2>
          <h3>4.1 包括哪些功能</h3>
          <p>校对稿、纪要、单句润色、问一问、每日回顾、主题归类、自动整理。这些功能需要调用云端大语言模型，按「积分」计费（见第 6 节）；不使用它们，畅译的本机功能不受影响。</p>

          <h3>4.2 发送什么、不发送什么</h3>
          <ul>
            <li><strong>只发送打码后的文字</strong>：发送前，畅译在您的设备上按您的词库把敏感词打码。手动发起时，您可以先预览打码后的文字再决定是否发送；开启「自动整理」后不再逐次预览，按词库自动打码，新出现的疑似敏感词会攒起来，在回顾里一次性向您确认</li>
            <li>随文字一并发送的，还可能有完成该次处理所需的辅助信息，例如您确认过的专有名词写法（这些词条可能包含人名）</li>
            <li><strong>不发送原音</strong></li>
          </ul>

          <h3>4.3 同意与撤销</h3>
          <ul>
            <li>每项云端功能首次使用前，畅译会单独征求您的同意</li>
            <li>问一问、每日回顾与主题归类会汇总多场会议的文字，三者共用一项「跨会议云端」同意</li>
            <li>您可以随时在「我的 › 服务与隐私」撤销同意。撤销后，<strong>已付费、正在进行的任务会完成</strong>，但<strong>不会开始新的云端处理</strong>；撤销不会删除您设备上的录音和文字，积分余额也会保留。以后想再用，重新同意即可</li>
          </ul>

          <h3>4.4 畅译服务器如何处理</h3>
          <ul>
            <li>文字经 HTTPS 加密传输到畅译服务器。服务器按「一次请求、一次处理」运行，处理结果随该次响应返回给您的设备</li>
            <li><strong>畅译服务器不存储您发送的文字及处理结果，也不将其用于训练任何模型</strong>。多步任务的进度与产出保存在您的设备上</li>
            <li>畅译服务器保留一份仅含元数据的访问日志，用于排查故障与防止滥用，<strong>保留 7 天后删除</strong>。日志记录时间、设备密钥哈希的前 8 位、请求 ID、处理类型、状态码、<strong>文字长度（不是内容）</strong>、模型用量与耗时；请求与响应的正文不写入日志。另有一份运维日志只记录功能类型与字数（不含正文），同样保留 7 天后删除</li>
          </ul>

          <h3>4.5 第三方模型服务商</h3>
          <p>文字的实际生成由第三方大模型服务商完成：畅译服务器把打码后的文字转交给服务商的接口，再把结果返回给您。</p>
          <p>转交的内容仅限完成该次处理所需的文字与指令，<strong>不包含您的账户标识或设备密钥</strong>。服务商及其服务器可能位于您所在国家或地区以外。服务商如何处理收到的数据（包括是否保留、是否用于训练）受其各自的隐私政策与服务条款约束，不在畅译的控制范围内；本政策中「不存储、不用于训练」的说法，仅指畅译服务器的行为。</p>

          <h2>5. 交给 AI 应用（系统剪贴板）</h2>
          <p>您也可以把会议内容交给自己选择的第三方 AI 应用（如 ChatGPT、Claude、Gemini、DeepSeek、豆包、Kimi、通义千问、智谱清言）整理：</p>
          <ul>
            <li>内容通过系统剪贴板传递，由您在目标应用中手动粘贴；这一过程不经过畅译服务器</li>
            <li>首次使用前会征求您的同意，可在「我的 › 服务与隐私」撤销</li>
            <li>数据进入第三方 AI 应用后，其处理方式受该应用自己的隐私政策约束</li>
          </ul>

          <h2>6. 积分、购买与服务端账本</h2>
          <ul>
            <li><strong>录音、转写、搜索与导出不消耗积分</strong>。积分只用于第 4 节的云端功能</li>
            <li>积分以消耗型 App 内购买的方式出售，<strong>不是订阅，不会自动续费</strong>。所有付款由 App Store 处理，畅译接触不到您的银行卡或 Apple 账户信息</li>
            <li>为了记账，畅译服务器维护一份积分账本，记录以下信息：
              <ul>
                <li><strong>匿名账户标识</strong>：由畅译在您设备上随机生成的一串编号，用于标识您的积分账本。畅译服务器只看到这串编号，不知道您的姓名、邮箱、电话或 Apple 账户</li>
                <li><strong>积分余额与购买记录</strong>：App Store 交易编号、对应的积分数、价格与币种、时间</li>
                <li><strong>消耗记录</strong>：功能类型、计费字数、扣除的积分、时间与任务状态（不含文字内容）</li>
                <li><strong>账户与设备密钥的对应关系</strong>：用于防止同一设备反复领取新用户赠送的积分</li>
              </ul>
            </li>
            <li>这些信息用于：记账与扣费、换机后恢复余额、核对购买与处理退款、防止滥用</li>
            <li>消耗记录保留 12 个月，之后汇总为不含账户标识的月度统计，明细删除</li>
            <li>购买记录（交易编号、价格与币种）在账户存续期间保留，用于积分余额核对、Apple 退款与对账；您通过邮件申请删除后，我们会在 30 天内删除，法律或 Apple 对账义务要求保留的除外</li>
          </ul>

          <h2>7. 设备校验与防滥用</h2>
          <p>云端请求会使用 Apple 的 App Attest 服务生成的设备密钥，用于确认请求来自正版畅译 App 与真实设备，并据此限流、防止滥用。设备密钥不对应您的身份，不用于跨应用追踪。</p>

          <h2>8. 我们不做的事</h2>
          <ul>
            <li>不接入第三方统计、广告或追踪 SDK，App 内没有广告</li>
            <li>不需要注册账号，不收集姓名、邮箱、电话号码</li>
            <li>不出售您的数据</li>
          </ul>

          <h2>9. 儿童隐私</h2>
          <p>畅译不面向 13 岁以下儿童，我们不会有意收集儿童的个人信息。</p>

          <h2>10. 您的选择</h2>
          <ul>
            <li>不使用云端功能时，您的录音与文字都只留在设备上</li>
            <li>随时在「我的 › 服务与隐私」撤销云端同意</li>
            <li>删除录音或删除 App，即可删除设备上的数据</li>
            <li>如需查询或删除服务端账本中与您的匿名账户标识相关的记录，请发邮件至下方联系邮箱</li>
          </ul>

          <h2>11. 政策变更</h2>
          <p>本政策变更时，我们会在本页发布新版本并更新日期；涉及数据使用范围的重大变更，会在 App 内另行提示。</p>

          <h2>12. 联系我们</h2>
          <p>隐私相关问题请联系：<a href="mailto:support@voicebridge.top">support@voicebridge.top</a></p>
        </div>
