        <div class="container">
          <span class="eyebrow">隐私政策</span>
          <h1>隐私政策<span class="cn">VoiceBridge · 畅译</span></h1>
          <p class="subtitle">最后更新：2026 年 7 月 5 日 · 生效日期：2026 年 7 月 5 日</p>

          <div class="highlight">
            <p>🔒 VoiceBridge（畅译）的核心语音识别完全在设备本地完成，无需联网。当您主动使用「AI 智能纪要」功能时，转录文本将通过系统剪贴板传递至您选择的第三方 AI 应用，此操作需要您的明确同意。</p>
          </div>

          <h2>1. 数据收集</h2>
          <p>VoiceBridge 不收集任何个人信息，包括但不限于：</p>
          <ul>
            <li>姓名、邮箱、电话号码等身份信息</li>
            <li>设备标识符、IP 地址、位置信息</li>
            <li>使用习惯、行为分析数据</li>
          </ul>

          <h2>2. 语音数据处理</h2>
          <p>VoiceBridge 搭载 SenseVoice 端侧 AI 引擎，所有语音识别处理完全在您的 iPhone 上完成：</p>
          <ul>
            <li>录音文件仅存储在设备本地沙盒中</li>
            <li>转录文本仅存储在设备本地数据库中</li>
            <li>语音数据不会上传至任何服务器</li>
            <li>即使在飞行模式下，核心功能仍可正常使用</li>
          </ul>

          <h2>3. iCloud 同步</h2>
          <p><strong>本应用目前暂未开放 iCloud 同步备份功能。</strong></p>
          <p>在未来版本中，若我们引入此功能，它将：</p>
          <ul>
            <li>默认保持关闭，仅在您明确手动开启后启用</li>
            <li>仅同步 .txt 纯文本文件，绝不同步任何音频录音</li>
            <li>数据传输由 Apple iCloud 服务进行端到端加密处理</li>
            <li>允许您随时在应用设置中彻底关闭</li>
          </ul>

          <h2>4. 免费服务与无广告承诺</h2>
          <p>VoiceBridge 是一款完全免费的应用。我们不提供任何应用内购买项目、不设任何付费订阅服务，也不包含任何广告。我们在软件内不会收集、存储或处理任何您的支付、账单或交易信息。</p>

          <h2>5. 第三方服务与 AI 协作</h2>
          <p>VoiceBridge 不集成任何第三方分析、广告或追踪 SDK。应用不包含任何广告。</p>
          <p>VoiceBridge 提供「AI 智能纪要」功能，允许您将会议转录内容发送至第三方 AI 应用进行整理。使用该功能时：</p>
          <ul>
            <li><strong>发送的数据</strong>：会议标题、会议时长、转录文本、说话人标签，以及您自定义的术语词库内容</li>
            <li><strong>数据接收方</strong>：您主动选择的第三方 AI 应用，包括 ChatGPT (OpenAI)、Claude (Anthropic)、Gemini (Google)、DeepSeek（深度求索）、豆包（字节跳动）、Kimi（月之暗面）、通义千问（阿里巴巴）、智谱清言（智谱 AI）</li>
            <li><strong>传递方式</strong>：数据通过系统剪贴板传递，由您手动粘贴至目标应用。VoiceBridge 不直接向任何第三方服务器发送网络请求</li>
            <li><strong>用户控制</strong>：首次使用前，应用会征求您的明确同意。您可随时在「设置」中撤销授权，撤销后 AI 协作功能将不可使用</li>
            <li><strong>第三方责任</strong>：数据传递至第三方 AI 应用后，其处理方式受该应用各自的隐私政策约束。建议您在使用前阅读相关服务的隐私条款</li>
          </ul>

          <h2>6. iOS 设备端语音识别</h2>
          <p>部分非 SenseVoice 支持的语种（如印尼语、泰语、越南语、马来语、法语、德语、西班牙语等）使用 Apple iOS 原生语音识别，并已强制启用设备端识别（requiresOnDeviceRecognition）：音频在您的设备本地处理，不会上传至 Apple 或任何服务器（需系统已安装对应语言的听写组件）。该识别能力由 Apple 提供，具体请参阅 <a href="https://www.apple.com/legal/privacy/" target="_blank" rel="noopener">Apple 隐私政策</a>。</p>

          <h2>7. 儿童隐私</h2>
          <p>VoiceBridge 不面向 13 岁以下儿童，不会有意收集儿童的个人信息。</p>

          <h2>8. 政策变更</h2>
          <p>如本隐私政策发生变更，我们将在此页面发布更新版本并更新生效日期。建议您定期查阅。</p>

          <h2>9. 联系我们</h2>
          <p>如有隐私相关问题，请联系：<a href="mailto:support@voicebridge.top">support@voicebridge.top</a></p>
        </div>
