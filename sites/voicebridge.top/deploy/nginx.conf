# ============================================================
#  Nginx config for voicebridge.top static website with SSL
#  Path: /etc/nginx/sites-available/voicebridge.top
#  缓存策略：HTML no-cache（ETag 304，发版即时生效）；
#  静态资源一年缓存。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name voicebridge.top www.voicebridge.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voicebridge.top www.voicebridge.top;

    ssl_certificate /etc/letsencrypt/live/voicebridge.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voicebridge.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/voicebridge.top;
    index index.html;
    error_page 404 /404.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 静态资源缓存：一年不可变缓存
    location ~* \.(css|js|mjs|svg|ico|jpg|jpeg|png|gif|webp|avif|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # sitemap / robots：每日回源
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }




    # ---- polishd 云端修稿 API(v1.6) ----
    # 后端只听 127.0.0.1:8787,公网必须经这里 —— TLS 与限速都在这一层。
    # ⚠️ 上游是按 token 计费的模型,而 App Attest 验签尚未实现:
    # 服务内的每设备限速靠客户端自报的 X-Device-Key,换个字符串就重置,
    # 按 IP 的 limit_req 是当前唯一真实的盗刷兜底。
    location /api/ {
        limit_req zone=polishd burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上游模型单次调用上限 25s,读超时必须大于它,否则连接先被掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 修稿是逐块提交,包体小;给 256k 足够,顺带挡住乱塞大包
        client_max_body_size 256k;

        # API 一律不缓存
        add_header Cache-Control "no-store" always;
        access_log /var/log/nginx/polishd.access.log;
    }

    # HTML：每次协商（ETag → 304），部署后立即生效
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
