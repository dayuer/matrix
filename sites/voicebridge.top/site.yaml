llms:
  enabled: true
  summary: >-
    VoiceBridge（畅译）是一款 iOS 录音转文字与 AI 会议纪要 App。语音识别、说话人分离与搜索在设备本地完成，原音不上传任何服务器；校对稿、纪要、问一问等云端功能为可选项，只发送打码后的文字，按积分（消耗型内购，非订阅）计费，畅译服务器不存储、不用于训练，第三方模型服务商另受其隐私政策约束；无第三方统计与广告、无需注册；支持 12 语种离线识别，要求 iOS 17.0 及以上。

