# ============================================================
#  443 兜底 server —— 匹配不到任何 server_name 的请求的归宿
#  Path:   /etc/nginx/sites-available/000-default-catchall
#  Enable: ln -sfn ../sites-available/000-default-catchall \
#              /etc/nginx/sites-enabled/000-default-catchall
#
#  背景：本机原先没有任何 default_server，nginx 于是把加载顺序第一个
#  443 server（sites-enabled 字母序第一名 arrfunds.com）当成默认 server。
#  后果是任何解析到本机、但 server_name 没写全的域名都会静默显示成
#  ARR Funds 首页——www.didi.bike / blog.didi.bike 就这么错了很久，
#  而且返回 200，任何健康检查都发现不了。
#
#  这里把默认归宿显式收成「拒绝握手」：配置遗漏会立刻暴露成 TLS 失败，
#  而不是伪装成另一个站点的内容。新站上线忘了配 server_name 时会当场报错。
#
#  只接管 443。80 端口的隐式默认是 conf.d/handmake.ai.conf，
#  属于同机其他产品，未动。
# ============================================================

server {
    # http2 必须显式写：nginx 的 HTTP/2 开关取自该 listen 套接字的
    # default server，这个 block 一旦成为 default 又不带 http2，
    # 全机所有站点的 h2 都会被关掉。
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # nginx >= 1.19.4：无需配置证书，直接拒绝未知 SNI 的 TLS 握手
    ssl_reject_handshake on;
}
