name: Deploy didi.bike

on:
  push:
    branches:
      - main
    paths:
      - 'apps/didi.bike/**'
      - 'themes/didi/**'
      - 'packages/**'
      - 'docs/didi.bike-drafts/**'
      - 'scripts/**'
      - '.github/workflows/deploy-bike.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先于构建失败，避免跑完 2000+ 页导出才发现没凭据
      - name: Preflight — 校验部署凭据
        env:
          HAS_KEY: ${{ secrets.VPS_A_SSH_KEY != '' }}
          HAS_HOST: ${{ secrets.VPS_A_HOST != '' }}
        run: |
          missing=""
          [ "$HAS_KEY"  = "true" ] || missing="$missing VPS_A_SSH_KEY"
          [ "$HAS_HOST" = "true" ] || missing="$missing VPS_A_HOST"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret:$missing。到 Settings → Secrets and variables → Actions 添加后重跑本 workflow。"
            exit 1
          fi
          echo "部署凭据就绪"

      # Node 22：marked@18 要求 >=20，isomorphic-dompurify@3.18 要求 ^20.19 || ^22.13 || >=24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: npm install

      # 构建顺序有依赖：blocks → site-kit → cli，然后才是主题包
      - name: Build & Export didi.bike
        run: |
          npm run build:platform
          npm run build -w @matrix/theme-didi
          cd apps/didi.bike
          npm run export

      - name: Deploy Static Web to VPS A
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_A_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_A_HOST }}
          REMOTE_USER: 'root'
          SOURCE: "apps/didi.bike/out/"
          TARGET: "/var/www/didi.bike"
